title: Linux SSH Failed Password Authentication
id: 0d6c0acf-5f6f-4aab-a3f3-6998319e41b0
status: experimental
description: Detects individual SSH failed-password messages that may support investigation of password guessing. A single event does not establish brute force.
author: NEXLEVR Intermediate Lab
date: 2026-10-22
logsource:
    product: linux
    service: sshd
detection:
    selection:
        message|contains: 'Failed password'
    condition: selection
fields:
    - message
falsepositives:
    - Legitimate user mistypes a password during a normal SSH login.
    - Administrator tests authentication or performs an authorized exercise.
level: low
tags:
    - attack.credential_access
    - attack.t1110.001
